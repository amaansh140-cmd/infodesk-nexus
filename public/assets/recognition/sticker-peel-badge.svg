<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="280" height="280">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2448c9" />
      <stop offset="100%" stop-color="#13266f" />
    </linearGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#13266f" flood-opacity="0.35" />
    </filter>
    <path id="textArcTop" d="M 40,140 A 100,100 0 0,1 240,140" fill="none" />
    <path id="textArcBottom" d="M 240,140 A 100,100 0 0,1 40,140" fill="none" />
  </defs>

  <!-- Outer Sticker Base -->
  <circle cx="140" cy="140" r="132" fill="#ffffff" filter="url(#badgeShadow)" />
  <circle cx="140" cy="140" r="124" fill="url(#badgeGrad)" stroke="#dfe5fb" stroke-width="2" />
  <circle cx="140" cy="140" r="114" fill="none" stroke="#4a6df0" stroke-width="1.5" stroke-dasharray="4,3" />

  <!-- Center Shield / Star -->
  <g transform="translate(140, 140)">
    <circle cx="0" cy="0" r="42" fill="#ffffff" />
    <path d="M 0,-24 L 6,-8 L 22,-8 L 9,2 L 14,18 L 0,8 L -14,18 L -9,2 L -22,-8 L -6,-8 Z" fill="#2448c9" />
    <circle cx="0" cy="0" r="14" fill="#a5d8ff" opacity="0.4" />
  </g>

  <!-- Top Arc Text -->
  <text font-family="'Figtree', system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="2" text-anchor="middle">
    <textPath href="#textArcTop" startOffset="50%">
      GOVT. RECOGNIZED
    </textPath>
  </text>

  <!-- Bottom Arc Text -->
  <text font-family="'Figtree', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#a5d8ff" letter-spacing="1.5" text-anchor="middle">
    <textPath href="#textArcBottom" startOffset="50%">
      ISO 9001:2015 BOARD
    </textPath>
  </text>
</svg>
