<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <filter id="stickerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#13266f" flood-opacity="0.22" />
    </filter>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2448c9" />
      <stop offset="100%" stop-color="#13266f" />
    </linearGradient>
  </defs>

  <!-- Base Badge Card -->
  <rect x="12" y="12" width="216" height="216" rx="36" fill="#fdfcf9" stroke="#dfe5fb" stroke-width="3" filter="url(#stickerShadow)" />
  <rect x="22" y="22" width="196" height="196" rx="28" fill="#ffffff" stroke="#e8edfc" stroke-width="1.5" />

  <!-- Inner Content -->
  <g transform="translate(120, 75)" text-anchor="middle">
    <text font-family="'Bricolage Grotesque', sans-serif" font-size="44" font-weight="800" fill="#2448c9" letter-spacing="-1">100%</text>
  </g>

  <g transform="translate(120, 118)" text-anchor="middle">
    <rect x="-80" y="-14" width="160" height="26" rx="13" fill="#dfe5fb" />
    <text font-family="'Figtree', sans-serif" font-size="12" font-weight="700" fill="#13266f" letter-spacing="0.5" dy="4">JOB ASSISTANCE</text>
  </g>

  <g transform="translate(120, 158)" text-anchor="middle">
    <text font-family="'Figtree', sans-serif" font-size="11" font-weight="600" fill="#566086">Practical IT Training</text>
    <text font-family="'Figtree', sans-serif" font-size="10.5" font-weight="500" fill="#566086" dy="16">4 Mumbai Branches</text>
  </g>

  <circle cx="120" cy="198" r="4" fill="#2448c9" />
</svg>
